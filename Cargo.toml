[package]
name = "gmb-poster"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
chromiumoxide = "0.9.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.10", features = ["derive"] }
fs2 = "0.4.3"
futures = "0.3.34"
imagesize = "0.15.0"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
